<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雲端心電感應 - Telepathy Game</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        notion: {
                            bg: '#F7F6F3',
                            card: '#FFFFFF',
                            border: '#E9E9E5',
                            hover: '#F1F0EC',
                            text: '#37352F',
                            muted: '#787774',
                            accent: '#5046E5',
                            pastelRed: '#FFE5E5',
                            pastelGreen: '#E6F4EA',
                            pastelBlue: '#E8F0FE',
                            pastelYellow: '#FEF3C7',
                            pastelPurple: '#F3E8FF',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* 3D CSS 翻牌關鍵樣式 */
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        .card-inner {
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .card-inner.flipped {
            transform: rotateY(180deg);
        }
    </style>
</head>
<body class="bg-notion-bg text-notion-text font-sans min-h-screen flex flex-col justify-between selection:bg-amber-100">

    <!-- 頂部導覽列 -->
    <header class="w-full max-w-4xl mx-auto px-4 py-4 flex justify-between items-center border-b border-notion-border/60">
        <div class="flex items-center space-x-2 cursor-pointer" onclick="goHome()">
            <span class="text-2xl">🧠</span>
            <h1 class="text-lg font-bold tracking-tight text-slate-800">雲端心電感應</h1>
            <span class="text-xs px-2 py-0.5 rounded-full bg-slate-100 text-slate-500 font-mono">v1.0</span>
        </div>
        <div id="room-badge" class="hidden flex items-center space-x-2 bg-white px-3 py-1.5 rounded-xl border border-notion-border shadow-sm text-sm">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span class="text-notion-muted">房號:</span>
            <span id="display-room-id" class="font-mono font-bold text-slate-700">----</span>
            <button onclick="copyRoomLink()" class="ml-1 text-slate-400 hover:text-slate-600 transition" title="複製房間連結">
                📋
            </button>
        </div>
    </header>

    <!-- 主要內容區塊 -->
    <main class="w-full max-w-4xl mx-auto px-4 py-6 flex-1 flex flex-col justify-center">

        <!-- 登入與建房畫面 (SETUP STEP) -->
        <div id="login-view" class="max-w-md mx-auto w-full bg-white p-8 rounded-3xl border border-notion-border shadow-sm transition-all duration-300">
            <div class="text-center mb-6">
                <div class="text-5xl mb-3">🔮</div>
                <h2 class="text-2xl font-bold text-slate-800">進入默契遊戲</h2>
                <p class="text-sm text-notion-muted mt-1">輸入暱稱與房號，與朋友開始心電感應！</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">玩家暱稱</label>
                    <input type="text" id="input-player-name" placeholder="例如：小明" class="w-full px-4 py-3 bg-slate-50 rounded-2xl border border-notion-border focus:outline-none focus:ring-2 focus:ring-slate-400 focus:bg-white text-sm transition" />
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">房間代碼</label>
                    <div class="flex space-x-2">
                        <input type="text" id="input-room-id" placeholder="例如：8888" class="flex-1 px-4 py-3 bg-slate-50 rounded-2xl border border-notion-border focus:outline-none focus:ring-2 focus:ring-slate-400 focus:bg-white text-sm font-mono tracking-widest transition" />
                        <button onclick="generateRandomRoom()" class="px-3 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-2xl text-xs font-medium transition" title="隨機生成房號">
                            🎲 隨機
                        </button>
                    </div>
                </div>

                <button onclick="joinRoom()" class="w-full mt-2 py-3.5 bg-slate-800 hover:bg-slate-900 text-white font-medium rounded-2xl shadow-sm transition transform active:scale-[0.99] flex items-center justify-center space-x-2">
                    <span>進入房間</span>
                    <span>➔</span>
                </button>
            </div>
        </div>

        <!-- 遊戲主要視圖 (GAME MAIN VIEW) -->
        <div id="game-view" class="hidden space-y-6">
            
            <!-- 題目區域卡片 -->
            <div class="bg-white p-6 md:p-8 rounded-3xl border border-notion-border shadow-sm text-center relative overflow-hidden">
                <div class="absolute -top-10 -right-10 w-32 h-32 bg-amber-50 rounded-full blur-2xl -z-0"></div>
                <div class="relative z-10">
                    <div class="inline-flex items-center space-x-2 px-3 py-1 bg-amber-50 text-amber-700 text-xs rounded-full font-medium mb-3 border border-amber-100">
                        <span id="game-status-pill">⏳ 等待房主出題</span>
                    </div>
                    <h3 id="question-display" class="text-2xl md:text-3xl font-bold text-slate-800 tracking-tight">
                        等待房主設定題目...
                    </h3>
                </div>
            </div>

            <!-- 玩家作答輸入區塊 (僅在 playing 階段顯示) -->
            <div id="answer-input-box" class="bg-white p-5 rounded-2xl border border-notion-border shadow-sm">
                <form onsubmit="submitAnswer(event)" class="flex flex-col sm:flex-row items-center gap-3">
                    <input type="text" id="player-answer-input" placeholder="寫下你的心電感應答案..." class="w-full flex-1 px-4 py-3 bg-slate-50 rounded-xl border border-notion-border focus:outline-none focus:ring-2 focus:ring-slate-400 focus:bg-white text-sm transition" />
                    <button type="submit" id="btn-submit-answer" class="w-full sm:w-auto px-6 py-3 bg-slate-800 hover:bg-slate-900 text-white text-sm font-medium rounded-xl shadow-sm transition whitespace-nowrap">
                        送出答案 🚀
                    </button>
                </form>
            </div>

            <!-- 玩家答案卡片區 (3D 翻牌牆) -->
            <div>
                <div class="flex justify-between items-center mb-4 px-1">
                    <h4 class="font-bold text-slate-700 text-base flex items-center gap-2">
                        <span>👥</span> 玩家卡片牆 
                        <span id="submitted-count" class="text-xs font-normal bg-slate-100 px-2.5 py-0.5 rounded-full text-slate-600">0 人已回答</span>
                    </h4>
                    <span class="text-xs text-notion-muted">開牌時將自動觸發 3D 動畫</span>
                </div>

                <!-- 3D 卡片容器網路 -->
                <div id="cards-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                    <!-- 動態由 JS 產生 -->
                </div>
            </div>
        </div>

    </main>

    <!-- 隱藏房主按鈕與選單 (右下角 Floating) -->
    <div class="fixed bottom-5 right-5 z-50">
        <!-- 房主控制按鈕 (隱藏/切換) -->
        <button onclick="toggleHostPanel()" class="w-10 h-10 bg-slate-800 hover:bg-slate-900 text-white rounded-full shadow-lg flex items-center justify-center text-sm transition duration-200 transform hover:scale-105" title="隱藏房主控制台">
            🔑
        </button>

        <!-- 房主控制面板 Modal / Popup -->
        <div id="host-panel" class="hidden absolute bottom-14 right-0 w-80 bg-white/95 backdrop-blur-md p-5 rounded-2xl border border-notion-border shadow-xl text-left space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                <h4 class="font-bold text-slate-800 text-sm flex items-center gap-1">
                    <span>👑</span> 房主控制台
                </h4>
                <button onclick="toggleHostPanel()" class="text-xs text-slate-400 hover:text-slate-600">✕</button>
            </div>

            <div class="space-y-3">
                <!-- 出題區塊 -->
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">設定題目：</label>
                    <div class="flex gap-1.5">
                        <input type="text" id="host-question-input" placeholder="例如：提到甜點會想到？" class="flex-1 px-3 py-1.5 text-xs bg-slate-50 border border-notion-border rounded-lg focus:outline-none focus:ring-1 focus:ring-slate-400" />
                        <button onclick="hostSetQuestion()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-white text-xs font-medium rounded-lg transition whitespace-nowrap">
                            出題
                        </button>
                    </div>
                </div>

                <!-- 開牌按鈕 -->
                <div>
                    <button onclick="hostReveal()" class="w-full py-2 bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold rounded-xl shadow-sm transition flex items-center justify-center space-x-1">
                        <span>✨ 全體開牌 (Reveal)</span>
                    </button>
                </div>

                <!-- 重置局 -->
                <div class="pt-2 border-t border-slate-100">
                    <button onclick="hostReset()" class="w-full py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 text-xs font-medium rounded-lg transition">
                        🔄 清空狀態 / 下一局
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部資訊 -->
    <footer class="w-full max-w-4xl mx-auto px-4 py-4 text-center text-xs text-notion-muted">
        Notion 極簡風雲端心電感應 &copy; 2026 Telepathy Party Game
    </footer>

    <!-- 通知 Toast -->
    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-4 py-2 rounded-xl text-xs shadow-lg opacity-0 pointer-events-none transition duration-300 z-50">
        提示訊息
    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        // 設定標準 API 常數與 Sheet 名稱
        const SHEET_NAME = 'TelepathyData';
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwx_fy5J3P6kNBLH7KBTlXneeOpHsQMPDyIK5HV18KfHrqizU7xKuImRCFW3zwhSD68/exec";

        // 全域狀態
        let currentRoom = "";
        let playerName = "";
        let pollingTimer = null;

        // 初始化頁面
        window.onload = () => {
            // 解析 URL 參數 ?room=XXXX
            const urlParams = new URLSearchParams(window.location.search);
            const roomParam = urlParams.get('room');
            if (roomParam) {
                document.getElementById('input-room-id').value = roomParam;
            }
        };

        // 提示訊息功能 (取代 alert)
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 2500);
        }

        // 隨機產生 4 位數房號
        function generateRandomRoom() {
            const randomCode = Math.floor(1000 + Math.random() * 9000).toString();
            document.getElementById('input-room-id').value = randomCode;
        }

        // 回到首頁
        function goHome() {
            if (pollingTimer) clearInterval(pollingTimer);
            currentRoom = "";
            document.getElementById('game-view').classList.add('hidden');
            document.getElementById('login-view').classList.remove('hidden');
            document.getElementById('room-badge').classList.add('hidden');
        }

        // 進入/加入房間
        function joinRoom() {
            const nameInput = document.getElementById('input-player-name').value.trim();
            const roomInput = document.getElementById('input-room-id').value.trim();

            if (!nameInput) {
                showToast("請填寫您的暱稱！");
                return;
            }
            if (!roomInput) {
                showToast("請輸入房間代碼！");
                return;
            }

            playerName = nameInput;
            currentRoom = roomInput;

            // 更新 UI 狀態
            document.getElementById('display-room-id').innerText = currentRoom;
            document.getElementById('room-badge').classList.remove('hidden');
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('game-view').classList.remove('hidden');

            // 啟動輪詢 (Polling 每 2 秒)
            fetchRoomData();
            if (pollingTimer) clearInterval(pollingTimer);
            pollingTimer = setInterval(fetchRoomData, 2000);
        }

        // 複製房間連結
        function copyRoomLink() {
            const url = `${window.location.origin}${window.location.pathname}?room=${currentRoom}`;
            const dummy = document.createElement('input');
            document.body.appendChild(dummy);
            dummy.value = url;
            dummy.select();
            document.execCommand('copy');
            document.body.removeChild(dummy);
            showToast("房間連結已複製到剪貼簿！");
        }

        // 切換隱藏房主控制台
        function toggleHostPanel() {
            const panel = document.getElementById('host-panel');
            panel.classList.toggle('hidden');
        }

        // API GET: 獲取最新狀態
        async function fetchRoomData() {
            if (!currentRoom) return;

            try {
                const response = await fetch(`${GAS_API_URL}?room=${encodeURIComponent(currentRoom)}`);
                if (!response.ok) return;

                const data = await response.json();
                renderGame(data);
            } catch (err) {
                console.error("輪詢抓取資料失敗:", err);
            }
        }

        // API POST 發送請求 Helper
        async function sendAction(payload) {
            try {
                const response = await fetch(GAS_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ room: currentRoom, ...payload })
                });
                return await response.json();
            } catch (err) {
                console.error("發送操作失敗:", err);
                showToast("網路請求失敗，請重試");
            }
        }

        // 房主操作：設定題目
        async function hostSetQuestion() {
            const q = document.getElementById('host-question-input').value.trim();
            if (!q) {
                showToast("請輸入題目內容！");
                return;
            }
            showToast("出題中...");
            await sendAction({ action: 'set_question', question: q });
            document.getElementById('host-question-input').value = '';
            fetchRoomData();
        }

        // 房主操作：開牌
        async function hostReveal() {
            showToast("觸發全體開牌！");
            await sendAction({ action: 'reveal' });
            fetchRoomData();
        }

        // 房主操作：重置
        async function hostReset() {
            showToast("已重置房間！");
            await sendAction({ action: 'reset' });
            fetchRoomData();
        }

        // 玩家作答
        async function submitAnswer(e) {
            e.preventDefault();
            const ansInput = document.getElementById('player-answer-input');
            const ans = ansInput.value.trim();
            if (!ans) {
                showToast("請輸入答案！");
                return;
            }

            const btn = document.getElementById('btn-submit-answer');
            btn.disabled = true;
            btn.innerText = "傳送中...";

            await sendAction({
                action: 'submit_answer',
                playerName: playerName,
                answer: ans
            });

            btn.disabled = false;
            btn.innerText = "送出答案 🚀";
            showToast("答案已送出！等待開牌...");
            fetchRoomData();
        }

        // 畫面渲染邏輯
        function renderGame(data) {
            const { status, question, answers } = data;
            const answersMap = answers || {};
            const playerList = Object.keys(answersMap);

            // 1. 題目區塊渲染
            const qDisplay = document.getElementById('question-display');
            const statusPill = document.getElementById('game-status-pill');
            const inputBox = document.getElementById('answer-input-box');

            if (status === 'setup') {
                qDisplay.innerText = "等待房主出題中...";
                statusPill.innerText = "⏳ 準備階段";
                statusPill.className = "inline-flex items-center space-x-2 px-3 py-1 bg-slate-100 text-slate-600 text-xs rounded-full font-medium mb-3 border border-slate-200";
                inputBox.classList.add('hidden');
            } else if (status === 'playing') {
                qDisplay.innerText = question || "題目載入中...";
                statusPill.innerText = "✏️ 玩家填答中";
                statusPill.className = "inline-flex items-center space-x-2 px-3 py-1 bg-amber-50 text-amber-700 text-xs rounded-full font-medium mb-3 border border-amber-200";
                inputBox.classList.remove('hidden');
            } else if (status === 'revealed') {
                qDisplay.innerText = question || "";
                statusPill.innerText = "🎉 已揭開答案";
                statusPill.className = "inline-flex items-center space-x-2 px-3 py-1 bg-emerald-50 text-emerald-700 text-xs rounded-full font-medium mb-3 border border-emerald-200";
                inputBox.classList.add('hidden');
            }

            // 更新已作答人數
            document.getElementById('submitted-count').innerText = `${playerList.length} 人已填寫`;

            // 2. 卡片牆渲染 (3D Flip Animation)
            const cardsContainer = document.getElementById('cards-container');

            if (playerList.length === 0) {
                cardsContainer.innerHTML = `
                    <div class="col-span-full text-center py-12 text-slate-400 bg-white rounded-2xl border border-dashed border-notion-border">
                        <span class="text-3xl block mb-2">🃏</span>
                        目前還沒有玩家加入填答...
                    </div>
                `;
                return;
            }

            // 柔和可愛馬卡龍色彩集
            const bgColors = [
                'bg-rose-50 border-rose-100 text-rose-800',
                'bg-sky-50 border-sky-100 text-sky-800',
                'bg-emerald-50 border-emerald-100 text-emerald-800',
                'bg-amber-50 border-amber-100 text-amber-800',
                'bg-purple-50 border-purple-100 text-purple-800',
                'bg-indigo-50 border-indigo-100 text-indigo-800'
            ];

            // 建立卡片 DOM
            cardsContainer.innerHTML = '';
            playerList.forEach((name, index) => {
                const answerText = answersMap[name];
                const isFlipped = (status === 'revealed');
                const colorClass = bgColors[index % bgColors.length];

                const cardWrapper = document.createElement('div');
                cardWrapper.className = 'perspective-1000 w-full h-40';

                cardWrapper.innerHTML = `
                    <div class="card-inner relative w-full h-full transform-style-3d ${isFlipped ? 'flipped' : ''}">
                        <!-- 正面 (未開牌) -->
                        <div class="absolute inset-0 w-full h-full bg-white border border-notion-border rounded-2xl p-4 shadow-sm flex flex-col justify-between items-center text-center backface-hidden">
                            <div class="w-full flex justify-between items-center text-xs text-notion-muted">
                                <span class="font-mono">#${index + 1}</span>
                                <span class="w-2 h-2 rounded-full ${answerText ? 'bg-emerald-400' : 'bg-slate-200'}"></span>
                            </div>
                            <div>
                                <div class="text-2xl mb-1">🎁</div>
                                <div class="font-bold text-slate-700 text-sm truncate max-w-[120px]">${name}</div>
                            </div>
                            <div class="text-[10px] font-medium ${answerText ? 'text-emerald-600 bg-emerald-50' : 'text-slate-400 bg-slate-50'} px-2 py-0.5 rounded-md">
                                ${answerText ? '已完成填寫' : '思考中...'}
                            </div>
                        </div>

                        <!-- 背面 (已開牌 - 顯示答案) -->
                        <div class="absolute inset-0 w-full h-full rounded-2xl p-4 shadow-sm flex flex-col justify-between items-center text-center backface-hidden rotate-y-180 border ${colorClass}">
                            <div class="text-xs font-bold opacity-75">${name} 的答案</div>
                            <div class="text-lg font-extrabold tracking-tight px-1 break-all line-clamp-2">
                                "${answerText}"
                            </div>
                            <div class="text-[10px] opacity-60 font-mono">
                                ✨ 心電感應
                            </div>
                        </div>
                    </div>
                `;

                cardsContainer.appendChild(cardWrapper);
            });
        }
    </script>
</body>
</html>
