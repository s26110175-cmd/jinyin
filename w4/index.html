<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>可愛動態留言板</title>
  <!-- 引入 Google Fonts 可愛圓體字型 (Fredoka) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       1. 全局與主題變數設定 (方便修改顏色)
       ========================================================= */
    :root {
      /* 【顏色設定】你可以在這裡修改主要配色！ */
      --bg-color: #fff5f7;           /* 網頁背景色 (溫和粉) */
      --card-bg: #ffffff;            /* 卡片背景色 */
      --text-main: #5a4b56;          /* 主文字顏色 (柔和深紫灰) */
      --accent-color: #ff8fa3;       /* 主要主題色 (可愛粉) */
      --accent-secondary: #ffb3c1;   /* 次要主題色 (淺粉) */
      --highlight-glow: #ff4d6d;     /* 輪播高亮時發光的顏色 */
      --font-family: 'Fredoka', "PingFang TC", "Microsoft JhengHei", sans-serif;
      
      /* 【輪播設定】動畫過渡時間 */
      --transition-speed: 0.5s;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      font-family: var(--font-family);
      color: var(--text-main);
      padding: 40px 20px;
      min-height: 100vh;
    }

    /* 標題區域 */
    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--accent-color);
      text-shadow: 2px 2px 0px #fff;
      display: inline-block;
      position: relative;
    }

    header h1::after {
      content: '✨';
      position: absolute;
      right: -35px;
      top: -5px;
    }

    header h1::before {
      content: '💖';
      position: absolute;
      left: -35px;
      top: -5px;
    }

    /* =========================================================
       2. 載入中動畫 (Loading Animation)
       ========================================================= */
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 0;
    }

    /* 愛心跳動動畫 */
    .heart-loader {
      font-size: 3rem;
      animation: heartbeat 1.2s infinite ease-in-out;
    }

    .loading-text {
      margin-top: 15px;
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--accent-color);
      letter-spacing: 2px;
      animation: blink 1.5s infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.3); }
      50% { transform: scale(1.1); }
      75% { transform: scale(1.25); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* =========================================================
       3. 瀑布流排版 (Masonry Layout)
       ========================================================= */
    .masonry-wall {
      /* 設定欄數 */
      column-count: 4;
      column-gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
      display: none; /* 載入完成前隱藏 */
    }

    /* 響應式斷點：手機與平板視窗彈性調整欄數 */
    @media (max-width: 1024px) { .masonry-wall { column-count: 3; } }
    @media (max-width: 768px)  { .masonry-wall { column-count: 2; } }
    @media (max-width: 480px)  { .masonry-wall { column-count: 1; } }

    /* =========================================================
       4. 留言卡片樣式與高亮特效
       ========================================================= */
    .card {
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      /* 防止卡片被跨欄截斷 */
      break-inside: avoid;
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.05);
      border: 3px solid #fff;
      position: relative;
      
      /* 設定動態轉換效果 */
      transition: transform var(--transition-speed), 
                  box-shadow var(--transition-speed), 
                  filter var(--transition-speed),
                  opacity var(--transition-speed);
      
      cursor: pointer;
    }

    /* 卡片頭像與姓名列 */
    .card-header {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: var(--accent-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      margin-right: 10px;
    }

    .author-name {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text-main);
    }

    /* 留言內容 */
    .card-body {
      font-size: 0.95rem;
      line-height: 1.6;
      word-wrap: break-word;
      color: #666;
    }

    /* 【亮起/高亮焦點特效 (Active Highlight)】 */
    .card.active {
      transform: scale(1.08) translateY(-5px);
      z-index: 10;
      /* 鮮豔發光外框 */
      border-color: var(--accent-color);
      box-shadow: 0 12px 30px rgba(255, 77, 109, 0.3), 
                  0 0 15px var(--highlight-glow);
      filter: blur(0px);
      opacity: 1;
    }

    /* 【沒被選中的卡片特效】讓焦點更集中 */
    .masonry-wall.has-active .card:not(.active) {
      filter: blur(1.5px);
      opacity: 0.65;
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <header>
    <h1>朋友對我的動態留言板</h1>
  </header>

  <!-- 讀取中動畫區塊 -->
  <div id="loading-container">
    <div class="heart-loader">💌</div>
    <div class="loading-text">讀取留言中...</div>
  </div>

  <!-- 瀑布流卡片牆 -->
  <div id="masonry-wall" class="masonry-wall"></div>

  <script>
    /* =========================================================
       JavaScript 邏輯區域
       ========================================================= */

    // 【設定區】你可以自由修改以下變數！
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR2wripPheWinIHuPGBjXENxaAbGNDR0PkoqtEMGE384GIBAtHXmS0wo3YGyRVi7yZw7DPvsSMnyLj4/pub?output=csv';
    
    // 💡 輪播切換的時間 (單位：毫秒，3000ms = 3秒)
    const CAROUSEL_INTERVAL = 3000; 

    // 可愛圖示陣列，隨機賦予每個留言頭像
    const EMOJIS = ['🐶', '🐱', '🐰', '🦊', '🐻', '🐼', '🐥', '🦄', '🍓', '🌸'];

    let messageCards = []; // 存放 DOM 卡片節點
    let currentIndex = 0;  // 當前輪播索引
    let carouselTimer = null;

    // 頁面載入後執行
    document.addEventListener('DOMContentLoaded', () => {
      fetchMessages();
    });

    /**
     * 1. 使用 fetch 讀取 CSV 資料
     */
    async function fetchMessages() {
      try {
        const response = await fetch(CSV_URL);
        const csvText = await response.text();
        
        // 解析 CSV 資料
        const parsedData = parseCSV(csvText);
        
        // 渲染卡片
        renderCards(parsedData);

        // 隱藏 Loading，顯示瀑布流牆面
        document.getElementById('loading-container').style.display = 'none';
        const wall = document.getElementById('masonry-wall');
        wall.style.display = 'block';

        // 啟動自動輪播特效
        startCarousel();

      } catch (error) {
        console.error('讀取 CSV 失敗:', error);
        document.querySelector('.loading-text').innerText = '載入失敗，請稍後再試！';
      }
    }

    /**
     * 2. CSV 解析器 (處理雙引號與留言內含逗號的情況)
     */
    function parseCSV(text) {
      const lines = text.trim().split('\n');
      const result = [];

      // 從第 1 行開始 (跳過第 0 行欄位標題)
      for (let i = 1; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;

        // 使用正則表達式切分 CSV 欄位（處理包含在雙引號內的逗號）
        const row = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || [];
        
        // 簡單切分備用邏輯（若正則匹配不完整時）
        const fields = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);

        if (fields.length >= 3) {
          // 清理引號
          const name = fields[1].replace(/^"|"$/g, '').trim();
          const message = fields[2].replace(/^"|"$/g, '').trim();

          if (name && message) {
            result.push({ name, message });
          }
        }
      }
      return result;
    }

    /**
     * 3. 將資料動態生成 HTML 卡片
     */
    function renderCards(data) {
      const wall = document.getElementById('masonry-wall');
      wall.innerHTML = ''; // 清空內容

      data.forEach((item, index) => {
        // 隨機選一個可愛頭像
        const randomEmoji = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];

        // 創建卡片 DOM Element
        const card = document.createElement('div');
        card.className = 'card';
        card.setAttribute('data-index', index);

        card.innerHTML = `
          <div class="card-header">
            <div class="avatar">${randomEmoji}</div>
            <div class="author-name">${escapeHTML(item.name)}</div>
          </div>
          <div class="card-body">
            ${escapeHTML(item.message)}
          </div>
        `;

        wall.appendChild(card);
      });

      // 取得所有產生的卡片物件
      messageCards = Array.from(document.querySelectorAll('.card'));
    }

    /**
     * 4. 輪播焦點特效控制
     */
    function startCarousel() {
      if (messageCards.length === 0) return;

      const wall = document.getElementById('masonry-wall');
      wall.classList.add('has-active'); // 啟用整體模糊輔助 class

      // 立即執行第一次高亮
      highlightCard(currentIndex);

      // 設定定時器 (setInterval)
      carouselTimer = setInterval(() => {
        // 切換到下一個卡片索引
        currentIndex = (currentIndex + 1) % messageCards.length;
        highlightCard(currentIndex);
      }, CAROUSEL_INTERVAL);
    }

    /**
     * 切換指定索引卡片的高亮狀態
     */
    function highlightCard(index) {
      messageCards.forEach((card, i) => {
        if (i === index) {
          card.classList.add('active');
          // 自動平滑捲動視窗至該卡片 (可選體驗改善)
          card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        } else {
          card.classList.remove('active');
        }
      });
    }

    /**
     * 安全轉義防範 XSS 攻擊
     */
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }
  </script>
</body>
</html>
